# BLE PHY HCI Transport Demo — nRF54L15
# TIMER10 + DPPIC10 软件 TIFS，直接操作 RADIO (不依赖 BT_LL_SW_SPLIT)
# HCI 占用 UART，调试输出走 RTT

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_BT=n

CONFIG_CLOCK_CONTROL=y

# UART for HCI H4
CONFIG_UART_INTERRUPT_DRIVEN=y
